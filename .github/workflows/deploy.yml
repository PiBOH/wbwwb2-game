name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]        # ← importante: il repo originale usa "master", non "main", qua è stato addattato per funzionare con main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'                    # deploya tutto il contenuto della root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
